<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наше небо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  /* ---------- themes ---------- */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #0b0820; --ink-2: #2a1458;
    --nebula: radial-gradient(ellipse at 18% 22%, rgba(255,90,200,.20), transparent 55%), radial-gradient(ellipse at 85% 78%, rgba(70,200,255,.16), transparent 55%);
    --text: #f1edff; --soft: #a9a3d6; --card: #171233;
    --glass: rgba(255,255,255,.07); --line: rgba(255,255,255,.16);
    --dust: #efe9ff; --link: rgba(225,215,255,.30);
    --gold: #ffe08a; --on-gold: #241c05; --danger: #ff9a9a; --shade: rgba(5,3,18,.55);
    --c-him: #9fc6ff; --c-her: #ffb59a; --c-both: #ffe08a;
    color-scheme: dark;
  }
  :root[data-sky="blue"] {
    --ink: #061a3d; --ink-2: #1f63c4; --nebula: none;
    --text: #eef5ff; --soft: #a9c4ee; --card: #0d2a59; --glass: rgba(255,255,255,.09); --line: rgba(255,255,255,.2);
    --dust: #f4f9ff; --link: rgba(220,235,255,.34); --shade: rgba(3,12,35,.55);
  }
  :root[data-sky="black"] {
    --ink: #000; --ink-2: #0c0c14; --nebula: none;
    --text: #f2f2f5; --soft: #8f8fa3; --card: #111118; --glass: rgba(255,255,255,.06); --line: rgba(255,255,255,.14);
    --dust: #fff; --link: rgba(255,255,255,.26); --shade: rgba(0,0,0,.65);
  }
  :root[data-sky="pink"] {
    --ink: #3a1030; --ink-2: #c2468f;
    --nebula: radial-gradient(ellipse at 80% 18%, rgba(255,214,150,.28), transparent 55%);
    --text: #fff0f7; --soft: #f2bddb; --card: #4a1640; --glass: rgba(255,255,255,.12); --line: rgba(255,255,255,.24);
    --dust: #fff0f7; --link: rgba(255,225,240,.38); --gold: #ffe3a0; --on-gold: #3a1030; --shade: rgba(40,8,32,.55);
    --c-him: #c9e6ff; --c-her: #ffe0d2; --c-both: #fff2a8;
  }
  :root[data-sky="aurora"] {
    --ink: #031318; --ink-2: #0c4a4a;
    --nebula: radial-gradient(ellipse at 50% 0%, rgba(90,255,170,.28), transparent 60%), radial-gradient(ellipse at 92% 42%, rgba(120,140,255,.18), transparent 55%);
    --text: #e8fff6; --soft: #9bd6c4; --card: #0b2a2e; --glass: rgba(255,255,255,.08); --line: rgba(255,255,255,.18);
    --dust: #e8fff6; --link: rgba(210,255,235,.32); --gold: #d9ff9a; --on-gold: #10300f; --shade: rgba(2,14,16,.55);
    --c-him: #8fe9ff; --c-her: #ffc2a8; --c-both: #d9ff9a;
  }
  :root[data-sky="light"] {
    --ink: #8fc3f0; --ink-2: #eaf5ff; --nebula: radial-gradient(ellipse at 20% 15%, rgba(255,226,190,.55), transparent 55%);
    --text: #14233f; --soft: #4b6187; --card: #ffffff; --glass: rgba(20,40,80,.06); --line: rgba(20,40,80,.18);
    --dust: #ffffff; --link: rgba(40,70,130,.38); --gold: #c97d00; --on-gold: #ffffff; --danger: #d64545; --shade: rgba(20,35,70,.35);
    --c-him: #2f6fd6; --c-her: #e8643c; --c-both: #d99a00;
    color-scheme: light;
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; touch-action: none; overscroll-behavior: none; }
  body {
    background-color: var(--ink);
    background-image: var(--nebula), radial-gradient(ellipse at 50% 42%, var(--ink-2) 0%, var(--ink) 72%);
    color: var(--text);
    font-family: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: background-color .5s;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    background: var(--ink); z-index: 10;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  input:focus-visible + span { outline: 2px solid var(--text); outline-offset: 2px; }
  input[type="text"]:focus-visible, input[type="date"]:focus-visible, input[type="number"]:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  #dust, #sky { position: fixed; inset: 0; width: 100%; height: 100%; }
  #sky { overflow: visible; touch-action: none; cursor: grab; }
  #sky.dragging { cursor: grabbing; }
  .recenter {
    position: fixed; z-index: 6; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 58px);
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--soft);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .recenter[hidden] { display: none; }
  .recenter:active { transform: scale(.94); }

  /* memory card + glow */
  .memory {
    position: fixed; z-index: 7; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 172px); max-width: 420px; margin: 0 auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 44px 14px 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: rise .5s cubic-bezier(.2,.8,.2,1);
  }
  .memory[hidden] { display: none; }
  .mem-l { margin: 0 0 4px; font-size: 12px; color: var(--soft); }
  .mem-h { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: 24px; line-height: 1.15; }
  .mem-t { margin: 6px 0 12px; font-size: 14px; line-height: 1.4; color: var(--soft); }
  .mem-x { position: absolute; top: 6px; right: 6px; width: 38px; height: 38px; border: 0; background: none; color: var(--soft); font-size: 22px; cursor: pointer; border-radius: 50%; }
  .memory .ghost { padding: 9px 18px; font-size: 14px; }
  .ring.mem { stroke: var(--text); animation-duration: 3.4s; }

  /* planets orbiting the main star */
  .planets { opacity: 0; animation: fade 1.6s ease 1.2s forwards; }
  .orbit { fill: none; stroke: var(--link); stroke-width: .6; stroke-dasharray: 1 5; stroke-linecap: round; }
  .planet { cursor: pointer; }
  .planet:focus-visible { outline: none; }
  .planet:focus-visible .pbody { stroke: var(--text); stroke-width: 1.5; }
  .drop { animation: rain 1.2s linear infinite; }
  @keyframes rain { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(22px); opacity: 0; } }
  .heart { animation: floatup 3s ease-in infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes floatup { 0% { opacity: 0; transform: translateY(5px) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px) scale(1.1); } }
  .rb { animation: shimmer 3.5s ease-in-out infinite; }
  @keyframes shimmer { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  .twk { animation: twk 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes twk { 0%, 100% { transform: scale(.4); opacity: .4; } 50% { transform: scale(1.2); opacity: 1; } }
  .bolt { animation: bolt 1.7s steps(1, end) infinite; }
  @keyframes bolt { 0% { opacity: 1; } 8% { opacity: 0; } 14% { opacity: 1; } 20% { opacity: .15; } 26% { opacity: 1; } 100% { opacity: 1; } }
  .fog { animation: fogdrift 6s ease-in-out infinite alternate; }
  @keyframes fogdrift { from { transform: translateX(-5px); } to { transform: translateX(5px); } }
  .zz { animation: zz 3.4s ease-in infinite; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 4px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(4px, -10px); } }
  .ripple { animation: ripple 2.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ripple { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }

  /* header */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px 0 68px;
    pointer-events: none;
    opacity: 0; animation: fade 1.6s ease .2s forwards;
  }
  h1 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: 34px; letter-spacing: .01em; line-height: 1.05; }
  #count { margin: 5px 0 0; color: var(--soft); font-size: 13px; }
  #count b { color: var(--gold); font-weight: 500; }
  #meta { margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--soft); align-items: center; }
  #meta svg { vertical-align: -4px; margin-right: 3px; }
  #meta b { font-weight: 500; color: var(--text); }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--pc, var(--gold)); box-shadow: 0 0 8px 2px var(--pc, var(--gold)); margin-right: 6px; animation: pulse 3s ease-in-out infinite; }
  .coins { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 22px); right: 18px; display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--gold); }
  .coins svg { display: block; }

  .burger {
    position: fixed; z-index: 6; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 12px);
    width: 48px; height: 48px; border: 0; background: none; border-radius: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; animation: fade 1.2s ease .2s forwards;
  }
  .burger:active { background: var(--glass); }
  .dotbadge { position: absolute; top: 8px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--gold); color: var(--on-gold); font-size: 11px; line-height: 16px; text-align: center; font-weight: 500; }
  .dotbadge[hidden] { display: none; }

  /* footer */
  footer {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    opacity: 0; animation: fade 1.6s ease 2.2s forwards;
  }
  .hint { margin: 0; color: var(--soft); font-size: 12px; text-align: center; min-height: 15px; }
  .primary, .ghost {
    font-size: 15px; cursor: pointer; border-radius: 999px; padding: 12px 24px;
    border: 1px solid var(--gold); background: var(--glass); color: var(--gold);
    transition: background .2s, transform .2s;
  }
  .primary:hover, .ghost:hover { background: var(--line); }
  .primary:active, .ghost:active { transform: scale(.97); }
  .primary:disabled, .ghost:disabled { opacity: .45; cursor: default; }
  .ghost.danger { border-color: var(--danger); color: var(--danger); }
  .link { font-size: 13px; color: var(--soft); background: none; border: 0; cursor: pointer; padding: 8px 10px; text-decoration: underline; text-underline-offset: 3px; }

  .acts { display: flex; gap: 8px; }
  .act {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; line-height: 1.1;
    background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 8px 6px; min-height: 56px; min-width: 0; flex: 1; cursor: pointer; white-space: nowrap;
  }
  .act b { font-weight: 500; color: var(--gold); }
  .acts { width: 100%; max-width: 420px; }
  .act.done { opacity: .6; }
  .act.ready { border-color: var(--gold); animation: glow 2.8s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 14px 1px var(--gold); } }
  @keyframes fade { to { opacity: 1; } }

  /* peer presence */
  .peer { position: fixed; left: 9%; top: 19%; z-index: 2; display: flex; align-items: center; gap: 9px; pointer-events: none; opacity: 0; transition: opacity 1.2s; }
  .peer.on { opacity: 1; }
  .peer i { width: 10px; height: 10px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 14px 5px var(--pc); animation: drift 9s ease-in-out infinite alternate; }
  .peer span { font-size: 12px; color: var(--soft); }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(16px, 20px); } }

  /* sky */
  .star { cursor: pointer; }
  .star:focus-visible { outline: none; }
  .star:focus-visible .core { stroke: var(--text); stroke-width: 1.5; }
  .star .in { opacity: 0; transform-box: fill-box; transform-origin: center; animation: ignite 1.3s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes ignite {
    0% { opacity: 0; transform: scale(.2); }
    60% { opacity: 1; transform: scale(1.25); }
    100% { opacity: 1; transform: scale(1); }
  }
  .halo { animation: pulse 4.5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .links { fill: none; stroke: var(--link); stroke-width: .8; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease 1.6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .date-tag { fill: var(--soft); font-size: 11px; text-anchor: middle; font-family: "Onest", system-ui, sans-serif; opacity: 0; animation: fade 1.6s ease 1.6s forwards; }
  .static .star:not(.fresh) .in { animation: none; opacity: 1; }
  .static .links { animation: none; stroke-dashoffset: 0; }
  .static .date-tag { animation: none; opacity: 1; }
  .ring { fill: none; stroke: var(--gold); stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } }
  .new-tag { fill: var(--gold); font-size: 11px; text-anchor: middle; font-family: "Onest", system-ui, sans-serif; }
  .dream-lbl { fill: var(--soft); font-size: 10px; text-anchor: middle; font-family: "Onest", system-ui, sans-serif; }

  /* sheets & drawer */
  .scrim { position: fixed; inset: 0; z-index: 29; background: var(--shade); opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  .scrim.on { opacity: 1; visibility: visible; transition: opacity .3s; }
  .drawer {
    position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; width: min(88vw, 390px);
    background: var(--card); color: var(--text); overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateX(-104%); visibility: hidden; transition: transform .32s cubic-bezier(.2,.8,.2,1), visibility 0s .32s;
    box-shadow: 8px 0 40px rgba(0,0,0,.35);
  }
  .drawer, .card { touch-action: pan-y; }
  .drawer.open { transform: none; visibility: visible; transition: transform .32s cubic-bezier(.2,.8,.2,1); }
  .d-top { display: flex; align-items: center; gap: 6px; margin: 0 0 14px; min-height: 44px; }
  .d-top h2 { flex: 1; margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: 28px; }
  .icon-btn { width: 44px; height: 44px; border: 0; background: none; border-radius: 12px; font-size: 26px; line-height: 1; color: var(--soft); cursor: pointer; }
  .icon-btn:active { background: var(--glass); }
  .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .sum div { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--soft); }
  .sum b { display: block; margin-top: 4px; font-size: 20px; font-weight: 500; color: var(--text); }
  .mi { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 16px 4px; font-size: 17px; cursor: pointer; }
  .mi:last-of-type { border-bottom: 1px solid var(--line); }
  .mi small { display: block; margin-top: 3px; font-size: 12px; color: var(--soft); }
  .mi .chev { color: var(--soft); font-size: 20px; }
  .nb { background: var(--gold); color: var(--on-gold); border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 500; }

  .sec-t { margin: 20px 0 8px; font-size: 13px; color: var(--soft); }
  .tcard { background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .tcard p { margin: 0 0 10px; font-size: 15px; line-height: 1.4; }
  .tcard .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 12px; color: var(--soft); }
  .tcard .ghost, .tcard .primary { padding: 9px 16px; font-size: 14px; }
  .state { font-size: 12px; color: var(--soft); }
  .state.ok { color: var(--gold); }
  .note { margin: 12px 0 0; font-size: 13px; line-height: 1.5; color: var(--soft); }

  .bar { height: 10px; border-radius: 6px; background: var(--glass); border: 1px solid var(--line); overflow: hidden; margin: 12px 0 8px; }
  .bar i { display: block; height: 100%; background: var(--gold); border-radius: 6px; transition: width .8s ease; }
  .dream-big { display: flex; flex-direction: column; align-items: center; margin: 4px 0 6px; }
  .dream-title { margin: 10px 0 2px; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: 28px; text-align: center; }
  .split { display: flex; justify-content: space-between; font-size: 13px; color: var(--soft); }

  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .theme { background: none; border: 2px solid var(--line); border-radius: 16px; padding: 8px; cursor: pointer; text-align: left; font-size: 14px; }
  .theme.on { border-color: var(--gold); }
  .theme i { display: block; height: 62px; border-radius: 10px; margin-bottom: 8px; position: relative; overflow: hidden; }
  .theme i::after { content: ""; position: absolute; left: 30%; top: 38%; width: 5px; height: 5px; border-radius: 50%; background: #fff; box-shadow: 30px 14px 0 -1px #fff, 52px -10px 0 -2px #fff, 10px 20px 0 -2px #fff; opacity: .9; }

  .sheet { position: fixed; inset: 0; z-index: 40; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .25s ease; }
  .sheet[hidden] { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .card {
    position: relative; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
    background: var(--card); border-radius: 24px 24px 0 0; padding: 26px 24px calc(env(safe-area-inset-bottom, 0px) + 28px);
    box-shadow: 0 -20px 60px rgba(0,0,0,.4); animation: rise .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .x { position: absolute; top: 12px; right: 14px; width: 40px; height: 40px; border: 0; background: none; color: var(--soft); font-size: 26px; cursor: pointer; border-radius: 50%; }
  .who { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 14px; color: var(--soft); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .when { margin: 0 0 16px; font-size: 14px; color: var(--soft); }
  .txt { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 500; font-size: 28px; line-height: 1.22; padding-right: 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
  .card h2 { margin: 0 0 16px; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: 28px; }
  label.field, fieldset { display: block; margin: 0 0 16px; padding: 0; border: 0; min-width: 0; }
  .field > span, legend { display: block; margin-bottom: 8px; font-size: 13px; color: var(--soft); padding: 0; }
  input[type="text"], input[type="date"], input[type="number"] {
    width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--glass);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label { position: relative; }
  .chips input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .chips span { display: block; font-size: 14px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); }
  .chips input:checked + span { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
  .msg { margin: 0 0 14px; font-size: 14px; line-height: 1.5; color: var(--soft); }
  .msg[hidden] { display: none; }
  .who-pick { display: grid; gap: 10px; margin-top: 6px; }
  .who-pick button { font-size: 17px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .moods { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .mood { display: flex; align-items: center; gap: 10px; background: var(--glass); border: 2px solid var(--line); border-radius: 14px; padding: 14px; cursor: pointer; font-size: 15px; text-align: left; }
  .mood.on { border-color: var(--gold); }
  .mood i { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: 0 0 12px 2px var(--mc); background: var(--mc); }

  /* ---------------- sky render ---------------- */
  function starSVG(s) {
    var p = pos(s.slot, s.id);
    var lit = isLit(s);
    var cv = 'var(--c-' + (s.by || 'both') + ')';
    var sz = s.size || 1, core = 1.8 + sz * 1.3, halo = sz * 7 + 8;
    var fresh = introDone && !rendered[s.id];
    var delay = introDone ? '0s' : (0.5 + (s.slot || 0) * 0.22).toFixed(2) + 's';
    var tf = 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')';
    var cls = 'star' + (lit ? '' : ' unlit') + (fresh ? ' fresh' : '');
    if (!lit) {
      return '<g class="' + cls + '" data-id="' + s.id + '" transform="' + tf + '" tabindex="0" role="button" aria-label="Звезда, которая ещё не загорелась"><g class="in" style="animation-delay:' + delay + '"><circle class="core" r="' + (core + 2) + '" fill="none" style="stroke:' + cv + '" stroke-opacity=".55" stroke-dasharray="2 3"/><circle r="20" fill="transparent"/></g></g>';
    }
    var inner = '<circle class="halo" r="' + halo + '" fill="url(#g-' + (s.by || 'both') + ')"/>' +
      (sz === 3 ? '<path d="M0 -15 L2.2 -2.2 L15 0 L2.2 2.2 L0 15 L-2.2 2.2 L-15 0 L-2.2 -2.2 Z" style="fill:' + cv + '" opacity=".9"/>' : '') +
      '<circle class="core" r="' + core + '" style="fill:' + cv + '"/><circle r="22" fill="transparent"/>';
    var extra = isNew(s) ? '<circle class="ring" r="' + (halo * 0.7) + '"/><text class="new-tag" y="' + (-(halo * 0.7) - 6) + '">новая</text>' : '';
    if (memoryId === s.id) extra += '<circle class="ring mem" r="' + (halo * 0.9) + '"/>';
    var tag = !s.slot ? '<text class="date-tag" y="34">' + esc(fmt(s.date)) + '</text>' : '';
    return '<g class="' + cls + '" data-id="' + s.id + '" transform="' + tf + '" tabindex="0" role="button" aria-label="Звезда: ' + esc(fmt(s.date)) + (isNew(s) ? ', новая' : '') + '"><g class="in" style="animation-delay:' + delay + '">' + inner + '</g>' + extra + tag + '</g>';
  }
  function dreamSVG() {
    var d = dreamInfo(), r = 15, circ = 2 * Math.PI * r;
    return '<g class="star dream" data-dream="1" transform="translate(338 150)" tabindex="0" role="button" aria-label="Общая мечта: ' + Math.round(d.pct * 100) + '%">' +
      '<circle r="' + (12 + d.pct * 20) + '" fill="url(#g-both)" opacity="' + (0.15 + d.pct * 0.7).toFixed(2) + '"/>' +
      '<circle r="' + r + '" fill="none" style="stroke:var(--line)" stroke-width="2"/>' +
      '<circle r="' + r + '" fill="none" style="stroke:var(--gold)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="' + (circ * d.pct).toFixed(1) + ' ' + circ.toFixed(1) + '" transform="rotate(-90)"/>' +
      '<circle r="6.5" style="fill:var(--soft)" opacity=".4"/><circle r="6.5" style="fill:var(--gold)" opacity="' + (0.15 + d.pct * 0.85).toFixed(2) + '"/>' +
      '<circle r="26" fill="transparent"/>' +

  function renderSky() {
    var list = stars.slice().sort(function (a, b) { return (a.slot || 0) - (b.slot || 0) || (a.created || 0) - (b.created || 0); });
    var litList = list.filter(isLit).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.slot || 0) - (b.slot || 0); });
    var d = '';
    litList.forEach(function (s, k) { var p = pos(s.slot, s.id); d += (k ? ' L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); });
    var links = litList.length > 1 ? '<path class="links" pathLength="1" d="' + d + '"/>' : '';

    list.forEach(function (s) { rendered[s.id] = 1; });

    renderHeader();

  /* ---------------- header / footer / aura / peer ---------------- */

  /* ---------------- dust canvas ---------------- */
  (function () {
    var cv = document.getElementById('dust'), ctx = cv.getContext('2d');
    var W = 0, H = 0, dust = [];
    function size() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dust = [];
      var n = Math.round(W * H / 5200);
      for (var i = 0; i < n; i++) dust.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + 0.25, p: Math.random() * 6.28, s: 0.4 + Math.random() * 1.2 });
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = dustColor;
      for (var i = 0; i < dust.length; i++) {
        var q = dust[i];
        ctx.globalAlpha = reduce ? 0.5 : 0.3 + 0.35 * Math.sin(t / 1000 * q.s + q.p);
        var px = ((q.x + dustShift.x) % W + W) % W, py = ((q.y + dustShift.y) % H + H) % H;
        ctx.beginPath(); ctx.arc(px, py, q.r, 0, 6.283); ctx.fill();
      }
      if (!reduce) requestAnimationFrame(draw);
    }
    drawStatic = function () { if (reduce) draw(0); };
    size(); draw(0);
    var lastW = W;
    window.addEventListener('resize', function () { if (window.innerWidth !== lastW) { lastW = window.innerWidth; size(); if (reduce) draw(0); } });
  })();

  /* ---------------- sheets ---------------- */

  /* ---------------- планеты настроения ---------------- */
  var PLANET_SCALE = 0.72;   // размер планеты и её погоды
  var ORBIT = { him: { R: 40, dur: 70, ang: 200 }, her: { R: 62, dur: 96, ang: 25 } };
  function fxRainbow() {
    var cols = ['#ff6b6b', '#ffb347', '#7ddc8a', '#6bb8ff'];
    return cols.map(function (c, i) { var r = 6.5 + i * 1.8; return '<path class="rb" d="M ' + (-r) + ' -2 A ' + r + ' ' + r + ' 0 0 1 ' + r + ' -2" fill="none" stroke="' + c + '" stroke-width="1.5" stroke-linecap="round" style="animation-delay:' + (i * 0.25) + 's"/>'; }).join('');
  }
  function weatherFX(m) {
    var out = '';
    if (m === 'sad') {
      out += '<ellipse cx="-4" cy="-17" rx="8" ry="4.6" fill="#8f98ba"/><ellipse cx="4" cy="-18.5" rx="6.5" ry="4.2" fill="#a2abcb"/>';
      [-6, 0, 6].forEach(function (x, i) { out += '<line class="drop" x1="' + x + '" y1="-12" x2="' + x + '" y2="-8.5" stroke="#8fc4ff" stroke-width="1.7" stroke-linecap="round" style="animation-delay:' + (i * 0.4) + 's"/>'; });
    } else if (m === 'happy') {
      out += fxRainbow();
    } else if (m === 'tender') {
      [[-7, -12], [6, -14], [0, -19]].forEach(function (p, i) {
        out += '<g transform="translate(' + p[0] + ' ' + p[1] + ')"><path class="heart" d="M0 3C-4 -1 -3 -4.5 0 -2.2C3 -4.5 4 -1 0 3Z" fill="#ff8fc2" style="animation-delay:' + (i * 1) + 's"/></g>';
      });
    } else if (m === 'energy') {
      [[-13, -9], [13, -7], [-9, 12], [11, 11]].forEach(function (p, i) {
        out += '<g transform="translate(' + p[0] + ' ' + p[1] + ')"><path class="twk" d="M0 -3.4L.9 -.9L3.4 0L.9 .9L0 3.4L-.9 .9L-3.4 0L-.9 -.9Z" fill="#e8fff1" style="animation-delay:' + (i * 0.28) + 's"/></g>';
      });
    } else if (m === 'spark') {
      out += '<circle class="ripple" r="11" fill="none" stroke="#ffb199" stroke-width="1.2"/><path class="bolt" d="M3 -22L-3 -12.5L1.2 -12.5L-2 -4.5L6 -15L1.5 -15Z" fill="#ffe45e"/>';
    } else if (m === 'tired') {
      out += '<g clip-path="url(#pclip)"><ellipse class="fog" cx="0" cy="3" rx="14" ry="3.2" fill="#fff" opacity=".32"/><ellipse class="fog" cx="0" cy="-4" rx="12" ry="2.6" fill="#fff" opacity=".24" style="animation-delay:-3s"/></g>' +
        '<text class="zz" x="9" y="-10" font-size="8" fill="#d8d0ff" style="font-family:Onest,sans-serif">z</text>' +
        '<text class="zz" x="14" y="-15" font-size="6" fill="#d8d0ff" style="font-family:Onest,sans-serif;animation-delay:1.6s">z</text>';
    } else if (m === 'calm') {
      out += '<circle class="ripple" r="11" fill="none" stroke="#bfe3ff" stroke-width="1.2"/><circle class="ripple" r="11" fill="none" stroke="#bfe3ff" stroke-width="1" style="animation-delay:1.4s"/>';
    }
    return out;
  }
  function moonCount() { return Math.min(6, Math.floor(flameInfo().best / 7)); }
  function moonsSVG(n) {
    var out = '';
    for (var i = 0; i < n; i++) {
      var r = 14 + i * 2.4, dur = (7 + i * 2.3).toFixed(1), dir = i % 2 ? -1 : 1, a0 = (i * 137) % 360;
      var tf = reduce ? ' transform="rotate(' + a0 + ')"' : '';
      var an = reduce ? '' : '<animateTransform attributeName="transform" type="rotate" from="' + a0 + ' 0 0" to="' + (a0 + 360 * dir) + ' 0 0" dur="' + dur + 's" repeatCount="indefinite"/>';
      out += '<circle r="' + r + '" fill="none" style="stroke:var(--link)" stroke-width=".4" opacity=".6"/>' +
        '<g' + tf + '>' + an + '<circle cx="' + r + '" cy="0" r="1.9" fill="#ece8ff"/><circle cx="' + (r + 0.5) + '" cy="-0.5" r=".7" fill="#fff" opacity=".85"/></g>';
    }
    return out;
  }
  function planetState(who) {
    var a = userOf(who).aura, fresh = !!(a && MOODS[a.m] && a.d === gameDay());
    return { fresh: fresh, m: fresh ? a.m : null, stale: !!(a && MOODS[a.m] && !fresh), col: fresh ? MOODS[a.m].c : 'var(--soft)' };
  }
  function planetBody(who, st) {
    return '<circle class="pbody" r="11" style="fill:' + st.col + '"' + (st.fresh ? '' : ' opacity=".4"') + '/><circle r="11" fill="url(#pshade)"/>' +
      '<circle r="12.6" fill="none" style="stroke:var(--c-' + who + ')" stroke-width="1.3" opacity=".9"/>';
  }
  function planetSVG(who) {
    var o = ORBIT[who], st = planetState(who), a = o.ang;
    var orbitT = reduce ? ' transform="rotate(' + a + ' 200 340)"' : '', counterT = reduce ? ' transform="rotate(' + (-a) + ')"' : '';
    var orbitA = reduce ? '' : '<animateTransform attributeName="transform" type="rotate" from="' + a + ' 200 340" to="' + (a + 360) + ' 200 340" dur="' + o.dur + 's" repeatCount="indefinite"/>';
    var counterA = reduce ? '' : '<animateTransform attributeName="transform" type="rotate" from="' + (-a) + ' 0 0" to="' + (-a - 360) + ' 0 0" dur="' + o.dur + 's" repeatCount="indefinite"/>';
    return '<circle class="orbit" cx="200" cy="340" r="' + o.R + '"/>' +
      '<g class="star planet" data-planet="' + who + '" tabindex="0" role="button" aria-label="Настроение: ' + esc(NAME[who]) + '"><g' + orbitT + '>' + orbitA +
      '<g transform="translate(' + (200 + o.R) + ' 340)"><g' + counterT + '>' + counterA + '<g transform="scale(' + PLANET_SCALE + ')">' + planetBody(who, st) + moonsSVG(moonCount()) + (st.fresh ? weatherFX(st.m) : '') + '</g><circle r="15" fill="transparent"/></g></g></g></g>';
  }
  var planetSig = '', lastMoons = null;
  function renderPlanets() {
    var mc = moonCount();
    var sig = ['him', 'her'].map(function (w) { return planetState(w).m || '-'; }).join('|') + '|' + mc;
    if (sig === planetSig) return;
    if (lastMoons !== null && mc > lastMoons) toast('У ваших планет появился новый спутник');
    lastMoons = mc;           // перерисовываем только при смене настроения, чтобы орбита не прыгала
    planetSig = sig;

  function daysBetween(a, b) {
    var x = a.split('-').map(Number), y = b.split('-').map(Number);
    return Math.round((Date.UTC(y[0], y[1] - 1, y[2]) - Date.UTC(x[0], x[1] - 1, x[2])) / 86400000);
  }
  function annivLabel(months, days) {
    if (months % 12 === 0) { var y = months / 12; return (y === 1 ? 'Год' : y + ' ' + pluralN(y, ['год', 'года', 'лет'])) + ' назад в этот день'; }
    return (months === 1 ? 'Месяц' : months + ' ' + pluralN(months, ['месяц', 'месяца', 'месяцев'])) + ' назад в этот день';
  }
  function pickMemory() {
    var today = gameDay(), t = today.split('-').map(Number);
    var pool = stars.filter(function (s) { return isLit(s) && !isSystemStar(s.id) && !hiddenFromMe(s) && s.date < today; })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.id < b.id ? -1 : 1; });
    var best = null, bestRank = 99, label = '';
    pool.forEach(function (s) {
      var p = s.date.split('-').map(Number), months = (t[0] - p[0]) * 12 + (t[1] - p[1]), days = daysBetween(s.date, today), rank = 99, lb = '';
      if (months >= 1 && t[2] === p[2]) { rank = months % 12 === 0 ? 0 : 1; lb = annivLabel(months); }
      else if (days >= 7 && days <= 28 && days % 7 === 0) { rank = 2; var w = days / 7; lb = (w === 1 ? 'Неделю' : w + ' ' + pluralN(w, ['неделя', 'недели', 'недель'])) + ' назад в этот день'; }
      if (rank < bestRank) { best = s; bestRank = rank; label = lb; }
    });
    if (best) return { star: best, label: label };
    var old = pool.filter(function (s) { return daysBetween(s.date, today) >= 14; });
    if (!old.length || hash(today + CONFIG.SKY_KEY) >= 0.6) return null;      // не каждый день, но у вас двоих выпадает одна и та же
    var pick = old[Math.floor(hash(today + 'pick') * old.length)];

        var can = have >= TIERS[t].p;
        h += '<div class="tcard"><div class="row"><span><b style="font-weight:500">' + TIERS[t].n + '</b><br><span class="tag">' + hints[t] + '</span></span><span class="nb">' + TIERS[t].p + '</span></div>' +
          '<div class="row" style="margin-top:12px"><span class="state">' + (can ? '' : 'Не хватает ' + (TIERS[t].p - have)) + '</span>' +
          '<button class="ghost" data-act="custom" data-p="' + t + '" type="button"' + (can ? '' : ' disabled') + '>Написать задание</button></div></div>';
      });
    } else if (v === 'tasks') {
      var ids = Object.keys(tasks).sort(function (a, b) { return (tasks[b].created || 0) - (tasks[a].created || 0); });
      var forMe = ids.filter(function (i) { return tasks[i].to === me && !(tasks[i].done && tasks[i].ok); });
      var byMe = ids.filter(function (i) { return tasks[i].from === me && !(tasks[i].done && tasks[i].ok); });
      var fin = ids.filter(function (i) { return tasks[i].done && tasks[i].ok; }).slice(0, 10);
      h = top('Задания', true);
      h += '<p class="sec-t" style="margin-top:0">Для меня</p>' + (forMe.length ? forMe.map(function (i) { return taskCard(i, tasks[i]); }).join('') : '<p class="note" style="margin-top:0">Пока ничего.</p>');
      h += '<p class="sec-t">Я купил(а)</p>' + (byMe.length ? byMe.map(function (i) { return taskCard(i, tasks[i]); }).join('') : '<p class="note" style="margin-top:0">Пока ничего. Загляни в магазин.</p>');
      if (fin.length) h += '<p class="sec-t">Выполнено</p>' + fin.map(function (i) { return taskCard(i, tasks[i]); }).join('');
    } else if (v === 'dream') {
      var dd = dreamInfo(), pc = Math.round(dd.pct * 100);
      h = top('Общая мечта', true) +
        '<div class="dream-big"><svg viewBox="-40 -40 80 80" width="120" height="120" aria-hidden="true"><circle r="' + (16 + dd.pct * 18) + '" fill="url(#g-both)" opacity="' + (0.2 + dd.pct * 0.8).toFixed(2) + '"/><circle r="26" fill="none" style="stroke:var(--line)" stroke-width="3"/><circle r="26" fill="none" style="stroke:var(--gold)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="' + (2 * Math.PI * 26 * dd.pct).toFixed(1) + ' ' + (2 * Math.PI * 26).toFixed(1) + '" transform="rotate(-90)"/><circle r="10" style="fill:var(--soft)" opacity=".4"/><circle r="10" style="fill:var(--gold)" opacity="' + (0.15 + dd.pct * 0.85).toFixed(2) + '"/></svg>' +
        '<p class="dream-title">' + esc(dd.title || 'Мечта без названия') + '</p></div>' +
        '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pc + '"><i style="width:' + pc + '%"></i></div>' +
        '<div class="split"><span>' + dd.total + ' из ' + dd.goal + '</span><span>' + pc + '%</span></div>' +
        '<div class="sum" style="margin-top:14px"><div>' + esc(NAME.him) + '<b>' + dd.him + '</b></div><div>' + esc(NAME.her) + '<b>' + dd.her + '</b></div></div>' +
        '<div class="actions" style="margin-top:6px"><button class="primary" data-act="contribute" type="button">Вложить монеты</button><button class="ghost" data-act="dreamtitle" type="button">Назвать мечту</button></div>' +
        '<button class="link" data-act="dreamgoal" type="button">Изменить цель (' + dd.goal + ')</button>' +
        '<p class="note">На 25%, 50%, 75% и 100% на небе загорается особая звезда.</p>';
    } else if (v === 'themes') {
      var cur = currentTheme();
      h = top('Тема неба', true) + '<div class="themes">' + THEMES.map(function (t) {
        return '<button class="theme' + (cur === t.id ? ' on' : '') + '" data-act="theme" data-p="' + t.id + '" type="button"><i style="background:' + t.g + '"></i>' + t.n + '</button>';
      }).join('') + '</div><p class="note">Тема хранится на этом устройстве, у каждого своя.</p>';
    }
    drawer.innerHTML = h;
  }

  /* ---------------- бесконечное небо: двигать и масштабировать ---------------- */
  var view = { x: 0, y: 0, k: 1 };
  var suppress = false;
  function worldT() { return 'translate(' + view.x.toFixed(1) + ' ' + view.y.toFixed(1) + ') scale(' + view.k.toFixed(3) + ')'; }
  function ctm() { return sky.getScreenCTM ? sky.getScreenCTM() : null; }
  function pxScale() { var m = ctm(); return m && m.a ? m.a : 1; }
  function toVB(cx, cy) {
    var m = ctm(); if (!m) return { x: cx, y: cy };
    var i = m.inverse();
    return { x: i.a * cx + i.c * cy + i.e, y: i.b * cx + i.d * cy + i.f };
  }
  var recenterBtn = document.getElementById('recenter');
  function applyView() {
    var w = document.getElementById('world'); if (w) w.setAttribute('transform', worldT());
    var far = Math.abs(view.x) > 30 || Math.abs(view.y) > 30 || Math.abs(view.k - 1) > 0.05;
    recenterBtn.hidden = !far;
    var sc = pxScale();
    dustShift.x = view.x * sc * 0.15; dustShift.y = view.y * sc * 0.15;
    if (drawStatic) drawStatic();
  }
  function zoomBy(cx, cy, ratio) {
    var k2 = Math.max(0.4, Math.min(2.5, view.k * ratio)), r = k2 / view.k;
    var c = toVB(cx, cy);
    view.x = c.x - (c.x - view.x) * r; view.y = c.y - (c.y - view.y) * r; view.k = k2;
    applyView();
  }
  var PAN_GAIN = 1;                        // 1 = небо едет ровно за пальцем; можно поставить больше
  var ptrs = {}, dragging = false, moved = 0, pinchD = 0, pinchM = null;
  var vx = 0, vy = 0, lastT = 0, flingId = 0, animId = 0, captured = null;
  function stopFling() { flingId++; animId++; }
  function fling() {
    var id = ++flingId, last = performance.now();
    (function step(t) {
      if (id !== flingId) return;
      var dt = Math.min(40, t - last); last = t;
      view.x += vx * dt; view.y += vy * dt;
      var f = Math.pow(0.95, dt / 16.7); vx *= f; vy *= f;
      applyView();
      if (Math.abs(vx) + Math.abs(vy) > 0.015) requestAnimationFrame(step);
    })(last);
  }
  function ptrIds() { return Object.keys(ptrs); }
  sky.addEventListener('pointerdown', function (e) {
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = ptrIds();
    stopFling();
    if (ids.length === 1) { moved = 0; suppress = false; dragging = true; vx = 0; vy = 0; lastT = e.timeStamp || performance.now(); }
    else if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      pinchD = Math.hypot(a.x - b.x, a.y - b.y) || 1; pinchM = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      moved = 100; suppress = true;
    }
  });
  window.addEventListener('pointermove', function (e) {
    var prev = ptrs[e.pointerId]; if (!prev) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = ptrIds();
    if (ids.length === 1 && dragging) {
      var dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 1) {
        sky.classList.add('dragging');
        if (moved > 8) {
          suppress = true;
          if (captured === null) { captured = e.pointerId; try { sky.setPointerCapture(e.pointerId); } catch (x) {} }
        }
        var s = pxScale(), gx = dx / s * PAN_GAIN, gy = dy / s * PAN_GAIN;
        var now = e.timeStamp || performance.now(), dtm = Math.max(1, now - lastT); lastT = now;
        vx = vx * 0.5 + (gx / dtm) * 0.5; vy = vy * 0.5 + (gy / dtm) * 0.5;
        view.x += gx; view.y += gy; applyView();
      }
    } else if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      var d = Math.hypot(a.x - b.x, a.y - b.y) || 1, m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      var s2 = pxScale(); view.x += (m.x - pinchM.x) / s2; view.y += (m.y - pinchM.y) / s2;
      zoomBy(m.x, m.y, d / pinchD);
      pinchD = d; pinchM = m;
    }
  });
  function endPtr(e) {
    if (!ptrs[e.pointerId]) return;
    delete ptrs[e.pointerId];
    var ids = ptrIds();
    if (captured === e.pointerId) { try { sky.releasePointerCapture(e.pointerId); } catch (x) {} captured = null; }
    if (ids.length === 0) {
      var wasDrag = dragging && moved > 8;
      dragging = false; sky.classList.remove('dragging');
      var idle = (e.timeStamp || performance.now()) - lastT;
      vx = 0; vy = 0;                      // без инерции: отпустил палец, небо остановилось
    }
    else if (ids.length === 1) { dragging = true; moved = 100; }
  }
  sky.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function (e) { if (dragging) e.preventDefault(); }, { passive: false });
  window.addEventListener('pointerup', endPtr);
  window.addEventListener('pointercancel', endPtr);
  sky.addEventListener('wheel', function (e) { e.preventDefault(); zoomBy(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  document.addEventListener('keydown', function (e) {
    var step = { ArrowLeft: [60, 0], ArrowRight: [-60, 0], ArrowUp: [0, 60], ArrowDown: [0, -60] }[e.key];
    if (!step || !sheet.hidden || drawer.classList.contains('open')) return;
    var t = e.target; if (t && t.tagName && /INPUT|TEXTAREA|SELECT/.test(t.tagName)) return;
    view.x += step[0] / view.k; view.y += step[1] / view.k; applyView();
  });
  function animateView(to, ms) {
    stopFling();
    var id = animId, from = { x: view.x, y: view.y, k: view.k };
    if (reduce) { view.x = to.x; view.y = to.y; view.k = to.k; applyView(); return; }
    var t0 = performance.now();
    (function step(t) {
      if (id !== animId) return;
      var k = Math.min(1, (t - t0) / (ms || 450)), e = 1 - Math.pow(1 - k, 3);
      view.x = from.x + (to.x - from.x) * e; view.y = from.y + (to.y - from.y) * e; view.k = from.k + (to.k - from.k) * e;
      applyView(); if (k < 1) requestAnimationFrame(step);
    })(t0);
  }
  function flyTo(wx, wy) { animateView({ x: 200 - wx * view.k, y: 350 - wy * view.k, k: view.k }, 650); }
  recenterBtn.addEventListener('click', function () { animateView({ x: 0, y: 0, k: 1 }); });

  /* ---------------- events ---------------- */
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  scrim.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!sheet.hidden) closeSheet(); else if (drawer.classList.contains('open')) closeMenu();
  });
  document.getElementById('burger').addEventListener('click', function () { if (!me) { openWho(function () { openMenu('home'); }); return; } openMenu('home'); });
  document.getElementById('add').addEventListener('click', function () { if (!me) { openWho(function () { openForm(null); }); return; } openForm(null); });
  bFlame.addEventListener('click', openFlame);
  bChest.addEventListener('click', openChest);
  bAura.addEventListener('click', openAura);
  sky.addEventListener('click', function (e) {
    if (suppress) { suppress = false; return; }
    var g = e.target.closest ? e.target.closest('.star') : null;
    if (!g) return;
    if (g.getAttribute('data-planet')) { openPlanet(g.getAttribute('data-planet')); return; }
    if (g.getAttribute('data-dream')) { if (!me) { openWho(function () { openMenu('dream'); }); } else openMenu('dream'); return; }
    openStar(g.getAttribute('data-id'));
  });
  sky.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') {
      var g = e.target.closest ? e.target.closest('.star') : null;
      if (g) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    }
  });
  drawer.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var a = b.getAttribute('data-act'), p = b.getAttribute('data-p');
    if (a === 'close') closeMenu();
    else if (a === 'back') { menuView = 'home'; renderDrawer(); }
    else if (a === 'view') { menuView = p; renderDrawer(); drawer.scrollTop = 0; }
    else if (a === 'who') openWho(function () { menuView = 'home'; renderDrawer(); });
    else if (a === 'custom') openCustomTask(Number(p) || 1);
    else if (a === 'done') setTask(p, 'done');
    else if (a === 'accept') setTask(p, 'ok');
    else if (a === 'contribute') openContribute();
    else if (a === 'dreamtitle') openDreamTitle();
    else if (a === 'dreamgoal') openDreamGoal();
    else if (a === 'theme') { applyTheme(p); renderDrawer(); }
  });

  /* ---------------- start ---------------- */
  var presenceStarted = false;
  function startPresence() { if (me && LIVE && !presenceStarted) { presenceStarted = true; db.presence(me); } }

  function boot() {
    applyTheme(ls(THEME_KEY) || 'cosmic');
    try { db = LIVE ? fbAdapter() : localAdapter(); }
    catch (err) { db = localAdapter(); LIVE = false; if (window.console) console.error(err); }
    var onErr = function (err) { countEl.textContent = 'Нет связи с базой. Проверь правила и ключи Firebase.'; if (window.console) console.error(err); };

    db.on('stars', function (v) {
      if (v === null && !seeded) { seeded = true; db.set('stars/s0', mainStar()); return; }
      stars = Object.keys(v || {}).map(function (k) { return Object.assign({ id: k }, v[k]); });
      starsReady = true;
      renderSky(); checkMilestones(); checkDreamSteps(); maybeMemory();
      if (!me && sheet.hidden) openWho();
    }, onErr);
    db.on('users', function (v) { users = v || {}; renderHeader(); }, onErr);
    db.on('flame', function (v) { flame = v || {}; renderHeader(); checkMilestones(); }, onErr);
    db.on('tasks', function (v) { tasks = v || {}; renderHeader(); }, onErr);
    db.on('dream', function (v) { dream = v || {}; renderSky(); checkDreamSteps(); }, onErr);
    db.on('presence', function (v) { presence = v || {}; renderHeader(); }, onErr);
    startPresence();
    setInterval(function () { renderHeader(); }, 30000);
  }

  var GATE_KEY = 'sky.gate.' + CONFIG.SKY_KEY;
  function norm(s) { return String(s).trim().toLowerCase().replace(/ё/g, 'е'); }
  if (!CONFIG.PASSWORD || ls(GATE_KEY) === 'ok') {
    boot();
  } else {
    applyTheme(ls(THEME_KEY) || 'cosmic');
    var gate = document.createElement('div');
    gate.className = 'gate';
    gate.innerHTML =
      '<form class="gate-box" autocomplete="off"><h2>Наше небо</h2><label for="pw">Введите пароль</label>' +
      '<input id="pw" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" aria-describedby="pwerr">' +
      '<p class="gate-err" id="pwerr" role="alert" aria-live="polite"></p><button class="primary" type="submit">Войти</button></form>';
    document.body.appendChild(gate);
    var form = gate.querySelector('form'), input = gate.querySelector('input'), gerr = gate.querySelector('#pwerr');
    input.focus();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (norm(input.value) === norm(CONFIG.PASSWORD)) { ls(GATE_KEY, 'ok'); gate.remove(); boot(); }
      else { gerr.textContent = 'Не то слово, попробуй ещё раз'; form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake'); input.select(); }
    });
  }
})();
</script>
